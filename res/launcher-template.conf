This is the preferences file for the "vmware-kvm Launcher" Java application.
Lines above the margin do not interfere with the parsing of options.

VM_FOLDER is the directory containing all of your VMware virtual machines,
VMWARE_PATH is where your VMware Workstation 17 is installed.

Add these values appropriately.
This app will fail to launch unless these values are correct.

--------------------------------------------------------------------------------

Some common questions are answered below:, assuming the environment is Windows,

Q: How do I obtain my VMWARE_PATH?
A: Open your Start Menu or use search to navigate to the icon of VMware
   Workstation 17. Right click the icon > More > Open file location. This should 
   open a folder with various shortcuts. Right click the VMware Workstation 
   shortcut there > Open file location (again). Now copy the path in the address 
   bar, and paste to VMWARE_PATH key below.

================================================================================
VM_FOLDER=
VMWARE_PATH=